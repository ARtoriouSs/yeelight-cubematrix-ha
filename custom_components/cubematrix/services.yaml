show:
  target:
    entity:
      integration: cubematrix
      domain: light
  fields:
    preset:
      example: check
      selector:
        text:
    definition:
      example: |
        name: dot
        size: 1x1
        palette: {x: '#ff0000'}
        frames: [[x]]
      selector:
        object:
    repeat:
      default: 1
      selector:
        select:
          options:
            - "1"
            - "2"
            - "3"
            - "forever"
          custom_value: true
    duration:
      selector:
        number:
          min: 0.1
          max: 3600
          step: 0.1
          unit_of_measurement: s
          mode: box
    fps:
      selector:
        number:
          min: 0.1
          max: 60
          step: 0.1
          mode: box
    then:
      default: restore
      selector:
        select:
          options:
            - "restore"
            - "hold"
            - "off"
          custom_value: true
    fit:
      default: error
      selector:
        select:
          options:
            - "error"
            - "center"
            - "tile"
    wait:
      default: false
      selector:
        boolean:
    wake:
      default: false
      selector:
        boolean:

set_background:
  target:
    entity:
      integration: cubematrix
      domain: light
  fields:
    preset:
      required: true
      example: fire
      selector:
        text:

stop:
  target:
    entity:
      integration: cubematrix
      domain: light

reload_presets:
